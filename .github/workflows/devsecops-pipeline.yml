name: DevSecOps Comprehensive Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  full-security-audit:
    name: DevSecOps Scans
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      # 1. Deteccion de Secretos (Gitleaks)
      - name: Escaneo de Secretos con Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz | tar -xz
          ./gitleaks detect --verbose || true

      # 2. Analisis SAST para Go (Gosec)
      - name: Analisis SAST Go con Gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest || true
          $(go env GOPATH)/bin/gosec -fmt=text ./... || true

      # 3. Analisis SAST para Python (Bandit)
      - name: Analisis SAST Python con Bandit
        run: |
          pip install bandit
          bandit -r app.py || true

      # 4. Analisis SAST Poliglota (Semgrep)
      - name: Analisis con Semgrep
        run: |
          pip install semgrep
          semgrep scan --config auto || true

      # 5. Linting de Dockerfile (Hadolint)
      - name: Analisis de Dockerfile con Hadolint
        run: |
          docker run --rm -i hadolint/hadolint < Dockerfile || true

      # 6. Analisis SCA y Vulnerabilidades (Trivy)
      - name: Analisis de Vulnerabilidades con Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /tmp
          /tmp/trivy fs --severity CRITICAL,HIGH,MEDIUM . || true
